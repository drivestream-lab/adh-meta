apiVersion: launchpad/v1
kind: HarnessConfig
delivery_contract: sdd-delivery/v2
delivery_roles:
  engineering-gate: platform-devs

org: drivestream-lab

profiles:
  meta-pm:
    skills:
      - repo: prayog-skills
        ref: v0.5.6
    community_skills:
      - source: github/awesome-copilot
        ref: v1.0.0
        skill: prd
    skill_runtimes:
      - .agents/skills
      - .claude/skills
    codeowners_template: CODEOWNERS.meta-pm
    harness_pin_template: harness-pin.meta.yaml

  python-backend:
    constitution:
      repo: python-services-rules
      ref: v0.5.12
    skills:
      - repo: prayog-skills
        ref: v0.5.6
    codeowners_template: CODEOWNERS.python-backend
    harness_pin_template: harness-pin.python-backend.yaml

  compose-local:
    skills:
      - repo: prayog-skills
        ref: v0.5.6
    skill_runtimes:
      - .agents/skills
    codeowners_template: CODEOWNERS.meta-pm
    harness_pin_template: harness-pin.meta.yaml

repos: {}
