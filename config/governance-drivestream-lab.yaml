apiVersion: launchpad/v1
kind: GovernanceConfig

org: drivestream-lab

stack_profiles:
  meta-pm: Programme management & ADR meta repo
  python-backend: Python / FastAPI microservice
  compose-local: Local Docker Compose (shared infra, no app constitution)

teams:
  - name: platform-devs
    description: Platform engineering
    privacy: closed
  - name: backend-devs
    description: Backend developers
    privacy: closed
  - name: frontend-devs
    description: Frontend developers
    privacy: closed
  - name: pm-team
    description: Programme management
    privacy: closed
  - name: release-managers
    description: Merge to main only
    privacy: closed

repos:
  adh-meta:
    stack: meta-pm
    teams: [platform-devs, pm-team]
    visibility: public
    description: ADH control-plane — PRD, pin, rubrics, roles

  adh:
    stack: python-backend
    teams: [platform-devs, backend-devs]
    visibility: public
    description: ADH orchestrator, Buzz, Hermes

  adh-iac-local:
    stack: compose-local
    teams: [platform-devs]
    visibility: public
    description: Shared local infra — postgres, redis, litellm, Buzz, Hermes compose

policy:
  default_branch: main
  integration_branch: develop
  require_pr_reviews: 1
  dismiss_stale_reviews: true

project_board:
  enabled: true
  name: "ADH"
